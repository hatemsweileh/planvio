name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    needs: assets
    name: Tests · PHP ${{ matrix.php }} · ${{ matrix.database }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        database: [sqlite]
        include:
          - php: '8.4'
            database: mariadb

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: planvio
          MARIADB_DATABASE: planvio_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, ctype, curl, fileinfo, gd, intl, json, mbstring, openssl, pdo, pdo_mysql, pdo_sqlite, tokenizer, xml, zip
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Download built assets
        uses: actions/download-artifact@v8
        with:
          name: assets
          path: public/build

      # The whole suite, including tests/Feature/Security. Those are the cases most worth
      # running on a machine that is not the author's, and a green build that reached green
      # by not running them is worse than a red one.
      - name: Run the test suite (SQLite)
        if: matrix.database == 'sqlite'
        run: php artisan test

      # The same suite again with AI switched off, which is how Planvio ships. phpunit.xml's
      # AI_ENABLED=true gives way to a value already in the environment, so this is also what
      # a contributor's shell can hand the suite without meaning to; a test that only passes
      # with AI on has to switch it on itself, and this is the run that catches one that does
      # not. Once is enough, so it runs on a single leg of the matrix.
      - name: Run the test suite with AI switched off (SQLite)
        if: matrix.database == 'sqlite' && matrix.php == '8.4'
        env:
          AI_ENABLED: 'false'
        run: php artisan test

      - name: Run migrations against MariaDB
        if: matrix.database == 'mariadb'
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: planvio_test
          DB_USERNAME: root
          DB_PASSWORD: planvio
        run: |
          php artisan migrate:fresh --seed --force
          php artisan migrate:rollback --force
          php artisan migrate --force

  style:
    name: Code style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - run: composer install --no-interaction --no-progress --prefer-dist

      - name: Pint
        run: php vendor/bin/pint --test

  assets:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Upload built assets
        uses: actions/upload-artifact@v7
        with:
          name: assets
          path: public/build
          retention-days: 1

      # Tailwind compiles a utility only when it finds the class written in one of the
      # sources resources/css/app.css lists, so a source dropped from that list loses its
      # classes silently: the build still succeeds, and the screens come out unstyled. The
      # classes below are logical-property utilities the right-to-left layout rests on, each
      # written in several views, plus `min-h-24`, which only resources/js/app.js writes (the
      # rich-text editor's height), so losing either source fails here.
      #
      # Two things keep the check honest. This file is not a Tailwind source — app.css
      # imports Tailwind with `source(none)` — so naming a class here cannot put it in the
      # build. Before that it could, and did: `ms-2` and `me-2` were on this list, no view
      # used either, and they passed because Tailwind had found them here. And the match is
      # on the compiled rule, `.ms-auto{` (or `.ms-auto,` where rules are merged), not on a
      # substring: `border-s` on its own is found inside `--tw-border-style`, which every
      # Tailwind build contains, and `text-end` inside `.sm\:text-end`, a different utility
      # that one view happens to use. A class with a dot or a slash in it would need
      # escaping in the pattern; these have none.
      - name: Fail if a Tailwind class was lost
        run: |
          CSS=$(find public/build/assets -name '*.css' | head -1)
          echo "Checking $CSS"
          for class in "ms-auto" "-me-1" "ps-3" "pe-1" "border-s" "border-e" "text-start" "text-end" "min-h-24"; do
            grep -qE -- "\.${class}[{,]" "$CSS" || { echo "::error::missing utility: $class"; exit 1; }
          done
          grep -q "noto-sans-arabic" "$CSS" || { echo "::error::Arabic font face missing"; exit 1; }
          echo "All checked utilities present."

  localisation:
    name: Translation integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl
          coverage: none

      - name: Every English key has an Arabic value, with its placeholders intact
        run: |
          php -r '
            $en = json_decode(file_get_contents("lang/en.json"), true) ?: [];
            $ar = json_decode(file_get_contents("lang/ar.json"), true) ?: [];
            $missing = array_keys(array_diff_key($en, $ar));
            $broken = [];
            foreach ($ar as $key => $value) {
                preg_match_all("/:[a-zA-Z_]+/", (string) $key, $a);
                preg_match_all("/:[a-zA-Z_]+/", (string) $value, $b);
                if (array_diff($a[0], $b[0])) { $broken[] = $key; }
            }
            printf("en %d keys, ar %d keys\n", count($en), count($ar));
            if ($missing) { printf("::error::%d untranslated: %s\n", count($missing), implode(" | ", array_slice($missing, 0, 5))); }
            if ($broken) { printf("::error::%d lost a placeholder: %s\n", count($broken), implode(" | ", array_slice($broken, 0, 5))); }
            exit($missing || $broken ? 1 : 0);
          '